<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DBS10042 Examination Hub</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
    }
    h2 {
      margin-top: 0;
      color: #1a202c;
      text-align: center;
      font-size: 22px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #4a5568;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #3182ce;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s;
      margin-top: 10px;
    }
    button:hover {
      background-color: #2b6cb0;
    }
    button:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
    }
    .status-msg {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }
    .status-msg.success {
      display: block;
      background-color: #c6f6d5;
      color: #22543d;
    }
    .status-msg.error {
      display: block;
      background-color: #fed7d7;
      color: #742a2a;
    }
    .status-msg.loading {
      display: block;
      background-color: #e2e8f0;
      color: #2d3748;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>DBS10042 Examination Hub</h2>
  <form id="loginForm">
    <div class="form-group">
      <label for="studentName">Nama Penuh:</label>
      <input type="text" id="studentName" required placeholder="Cth: AHMAD BIN ALI">
    </div>
    <div class="form-group">
      <label for="studentId">No. Pendaftaran (Student ID):</label>
      <input type="text" id="studentId" required placeholder="Cth: 01DEP23F1001">
    </div>
    <div class="form-group">
      <label for="studentClass">Kelas:</label>
      <input type="text" id="studentClass" required placeholder="Cth: DEP3A">
    </div>
    <div class="form-group">
      <label for="sessionTitle">Sesi Peperiksaan:</label>
      <select id="sessionTitle" required>
        <option value="">-- Pilih Sesi --</option>
        <option value="SESI 1 - FINAL EXAM">SESI 1 - FINAL EXAM</option>
        <option value="SESI 2 - QUIZ 1">SESI 2 - QUIZ 1</option>
      </select>
    </div>
    <button type="submit" id="submitBtn">Log Masuk & Hantar Data</button>
  </form>
  <div id="statusMsg" class="status-msg"></div>
</div>

<script>
  // Web App Deployment URL anda
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxHiPMSKN3Re3QZAvTj02QterMxHNP0T7BYzqiCewEztHsqzeR_gjqWblA7wCAqzVwP/exec";

  document.getElementById("loginForm").addEventListener("submit", async function(e) {
    // Halang form daripada auto-refresh/reload page
    e.preventDefault();

    const submitBtn = document.getElementById("submitBtn");
    const statusMsg = document.getElementById("statusMsg");

    submitBtn.disabled = true;
    submitBtn.innerText = "Sedang Menyimpan...";
    
    statusMsg.className = "status-msg loading";
    statusMsg.innerText = "Menghantar data ke Google Sheets...";

    // Format data yang akan dihantar
    const payload = {
      studentName: document.getElementById("studentName").value.trim(),
      studentId: document.getElementById("studentId").value.trim(),
      studentClass: document.getElementById("studentClass").value.trim(),
      sessionTitle: document.getElementById("sessionTitle").value.trim(),
      status: "LOGGED IN",
      timestamp: new Date().toLocaleString("en-GB")
    };

    try {
      // Gunakan text/plain untuk elak ralat CORS Preflight Google Apps Script
      const response = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (result.ok) {
        statusMsg.className = "status-msg success";
        statusMsg.innerText = "Data berjaya dimasukkan ke Google Sheets!";
        document.getElementById("loginForm").reset();
      } else {
        statusMsg.className = "status-msg error";
        statusMsg.innerText = "Ralat Backend: " + (result.error || "Gagal menyimpan.");
      }
    } catch (err) {
      console.error("Fetch error:", err);
      statusMsg.className = "status-msg error";
      statusMsg.innerText = "Gagal berhubung dengan pelayan. Sila pastikan Web App URL betul dan tetapan Access diset ke 'Anyone'.";
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "Log Masuk & Hantar Data";
    }
  });
</script>

</body>
</html>
